name: Bump asset versions

# 每次 push 到 main 时，自动给 CSS/JS 引用加新的版本号，
# 避免 GitHub Pages 的 10 分钟缓存让访客看到旧文件。

on:
  push:
    branches: [main]
    paths-ignore:
      - "steam.json"
      - "assets/steam/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bump version query
        run: node scripts/bump-version.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: bump asset versions [skip ci]"
            git push
          fi
