name: Update Steam data

# 定时抓 Steam 公开数据，写到 steam.json 并提交回仓库。
# 前端只 fetch 同源的 steam.json，不碰 API key。

on:
  schedule:
    # 每 30 分钟一次，但避开整点/半点。
    # GitHub 官方文档：整点是高负载时段，定时任务可能被延迟甚至丢弃，
    # 建议安排在非整点时刻。7 分和 37 分是常用选择。
    - cron: "7,37 * * * *"
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-steam.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam.json assets/steam
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update steam data"
            # 每 30 分钟一次，可能与其它提交撞车；先 rebase 再推
            git pull --rebase --autostash origin main || true
            git push
          fi
